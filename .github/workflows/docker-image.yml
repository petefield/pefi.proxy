name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Configure NuGet private feed
      run: dotnet nuget add source --username petefield --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name petefield "https://nuget.pkg.github.com/petefield/index.json"

    - name: Restore dependencies
      run: dotnet restore tests/pefi.proxy.tests/pefi.proxy.tests.csproj

    - name: Build test project
      run: dotnet build tests/pefi.proxy.tests/pefi.proxy.tests.csproj --no-restore

    - name: Run tests
      run: dotnet test tests/pefi.proxy.tests/pefi.proxy.tests.csproj --no-build --verbosity normal

  build:

    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      packages: write
      id-token: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVer to work properly

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0


    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ./src
        platforms: linux/amd64, linux/arm64
        tags: |
          ghcr.io/${{ github.repository }}:${{ steps.gitversion.outputs.semVer }}
          ghcr.io/${{ github.repository }}:latest
        push: true        
        secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"
